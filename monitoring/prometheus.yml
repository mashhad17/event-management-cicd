# Prometheus: what to collect, and how often.
global:
  scrape_interval: 15s

scrape_configs:
  # Pipeline metrics from the Jenkins Prometheus plugin (builds, results, durations, stages, queue).
  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["jenkins-event:8080"]

  # CPU, memory and disk of the EC2 server that runs Jenkins and Kubernetes.
  - job_name: server
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
