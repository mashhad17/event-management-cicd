# Tier 2: Node.js REST API. __IMAGE_TAG__ is replaced by Jenkins with the build's image tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: event-management
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # zero downtime: new pods must be ready before old ones stop
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: event-backend:__IMAGE_TAG__
          imagePullPolicy: Never   # built by Jenkins on the same Docker engine
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            - name: DB_HOST
              value: database
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: event-management
spec:
  selector:
    app: backend
  ports:
    - port: 3000
