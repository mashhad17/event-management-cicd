server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Lets the page show which frontend pod served it.
  add_header X-Frontend-Pod $hostname always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forwards API calls to the backend tier (Kubernetes service "backend").
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
